name: docker-jenkins-frontend
services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST_INTERNAL: http://api:3001
    ports:
    - ${FRONTEND_PORT:-3000}:3000
    init: true
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - >-
        Promise.all([ fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok)
        throw new Error('Frontend not ready'); await r.text();}), fetch('http://127.0.0.1:3000/api/attractions',
        {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || !Array.isArray(await r.json())) throw
        new Error('Frontend API proxy not ready');}) ]).then(() => process.exit(0)).catch(e => {console.error(e.message);
        process.exit(1);})
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - stack
networks:
  stack:
    external: true
    name: ${API_NETWORK_NAME:-docker-jenkins-pipeline_stack}
