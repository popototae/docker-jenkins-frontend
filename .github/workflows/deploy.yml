name: CI/CD Frontend
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-frontend
  cancel-in-progress: false
jobs:
  unit-tests:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Dependencies
      run: npm ci --include=dev
    - name: Run Unit Tests
      run: npm test -- --runInBand
  deploy:
    name: Build, Deploy and Health Check
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - name: Validate SSH Host Verification
      env:
        SSH_FINGERPRINT: ${{ secrets.VPS_HOST_KEY_FINGERPRINT }}
      run: |
        if [ -z "$SSH_FINGERPRINT" ]; then
          echo 'Set VPS_HOST_KEY_FINGERPRINT before deploying.' >&2
          exit 1
        fi
    - name: Deploy Tested Commit to VPS
      uses: appleboy/ssh-action@v1.2.0
      env:
        APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/lib/jenkins/workspace/docker-jenkins-frontend' }}
        DEPLOY_SHA: ${{ github.sha }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        fingerprint: ${{ secrets.VPS_HOST_KEY_FINGERPRINT }}
        port: '22'
        command_timeout: 30m
        envs: APP_DIR,DEPLOY_SHA
        script: |
          set -eu
          cd "$APP_DIR"
          checkout_owner=$(stat -c '%U' .git)
          deploy_as_owner() {
            if [ "$checkout_owner" = "$(id -un)" ]; then
              sh -s
            else
              sudo -n -H -u "$checkout_owner" \
                --preserve-env=APP_DIR,DEPLOY_SHA \
                sh -s
            fi
          }

          deploy_as_owner <<'DEPLOY'
          set -eu
          cd "$APP_DIR"
          case "$DEPLOY_SHA" in
            ''|*[!0-9a-fA-F]*) echo 'Invalid deploy commit' >&2; exit 2 ;;
          esac
          git fetch origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git reset --hard "$DEPLOY_SHA"
          echo "Deploying tested commit $DEPLOY_SHA"

          docker compose config --quiet
          docker compose build frontend
          docker compose up -d --wait --wait-timeout 180
          curl -4 -fsS --connect-timeout 3 --max-time 5 -o /dev/null http://127.0.0.1:3000/
          curl -4 -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:3000/api/attractions
          docker compose ps
          DEPLOY
